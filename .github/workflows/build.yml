# Rebuilds the static pages whenever a post or template changes
# (including posts saved from the /admin editor), then commits the result.
name: Build site
on:
  push:
    paths: ["content/**", "_src/**", "images/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node _src/build.mjs
      - name: Commit built pages
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "site-builder"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Rebuild site"
            git push
          fi
