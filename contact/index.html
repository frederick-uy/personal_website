<style>
body{margin:0;background:#F4EFE6;color:#26231F;font-family:Inter,system-ui,sans-serif}
a{color:#2E4A3B}a:hover{color:#1E3328}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0;letter-spacing:-0.01em}
p{margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px;box-sizing:border-box}
.narrow{max-width:760px;margin:0 auto;padding:0 40px;box-sizing:border-box}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.chapter{display:grid;grid-template-columns:140px minmax(0,1fr);gap:32px;padding:44px 0;border-top:1px solid #DCD3C3}
.life{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.contact{display:grid;grid-template-columns:minmax(0,0.8fr) minmax(0,1.2fr);gap:56px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label{display:flex;flex-direction:column;gap:8px;font-size:14px;color:#4F4942}
input,textarea{font:inherit;font-size:16px;color:#26231F;background:#FAF7F1;border:1px solid #D4CAB8;border-radius:6px;padding:13px 14px}
.nav a{color:#26231F;text-decoration:none;font-size:15px}
@media (max-width:1100px){.entries{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
@media (max-width:860px){figure[style*="height: 440px"]{height:auto !important;min-height:420px}figure[style*="height: 440px"] > div:last-child{padding:28px !important}.entries{grid-template-columns:minmax(0,1fr) !important}.cols2j{grid-template-columns:minmax(0,1fr) !important}#writing a.fade{grid-template-columns:minmax(0,1fr) !important;gap:6px !important}#writing a span[style*="text-align: right"]{text-align:left !important}.chapter,.life,.contact,.form{grid-template-columns:minmax(0,1fr)}.chapter{gap:10px}.wrap,.narrow{padding:0 20px}}
.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 32px}
.entry{display:flex;flex-direction:column;gap:18px;text-decoration:none;color:#26231F}
.entry .thumb{display:block;overflow:hidden;border-radius:6px;aspect-ratio:16/10;background:#E9E2D6}
.entry .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.entry:hover .thumb img{transform:scale(1.03)}
.entry:hover .ttl{color:#2E4A3B;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
html{scroll-behavior:smooth}
a,button{transition:color .2s ease,background-color .2s ease,border-color .2s ease,opacity .2s ease,transform .2s ease}
button{-webkit-tap-highlight-color:transparent}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
:focus-visible{outline:2px solid #A5521E;outline-offset:3px;border-radius:4px}
.fade{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
img{transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
.nav a.say{background:#26231F;color:#F4EFE6;border:1px solid #26231F;padding:10px 18px;border-radius:999px;font-weight:500}
.nav a.say:hover{background:#2E4A3B;border-color:#2E4A3B;color:#F4EFE6}
.btn-dark{display:inline-flex;align-items:center;gap:8px;background:#26231F;color:#F4EFE6 !important;text-decoration:none;padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;align-self:flex-start;transition:background-color .2s ease}
.btn-dark:hover,a:hover .btn-dark{background:#2E4A3B}
</style>
</head>
<body>
<div id="dc-root"><div style="min-height: 100vh; width: 100%">

<div style="border-bottom: 1px solid #DCD3C3">
<header class="wrap" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 28px">
<a href="/" style="font-family: Fraunces, Georgia, serif; font-size: 26px; color: #26231F; text-decoration: none">Frederick Uy</a>
<nav class="nav" aria-label="Main" style="display: flex; gap: 28px; flex-wrap: wrap; align-items: center">
<a href="/">Home</a>

<a href="/photography/">Photography</a>
<a href="/journal/">Journal</a>
<a href="/contact/" class="say" aria-current="page">Say hello</a>
</nav>
</header>
</div>

<section id="contact" class="wrap" style="padding-top: 56px; padding-bottom: 108px">
<div class="contact">
<div style="display: flex; flex-direction: column; gap: 18px">
<h1 style="font-size: clamp(40px, 4.6vw, 60px); line-height: 1.06">Hiring, booking, or just saying hi?</h1>
<p style="font-size: 17px; line-height: 1.65; color: #4F4942">Pick what fits and I’ll reply within a day.</p>
<p style="font-size: 16px; line-height: 1.9"><a href="mailto:frederickuy19@gmail.com">frederickuy19@gmail.com</a><br><a href="https://www.linkedin.com/in/frederickuy/">LinkedIn</a> · <a href="https://www.instagram.com/frederick.uy">Instagram</a></p>
</div>
<form data-on-submit="0" style="background: transparent; border: 1px solid #DCD3C3; border-radius: 6px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div role="group" aria-label="What is this about" style="display: flex; gap: 8px; flex-wrap: wrap">

<button type="button" data-on-click="1" aria-pressed="true" style="font: inherit; font-size: 14px; min-height: 44px; padding: 10px 16px; border-radius: 999px; cursor: pointer; background: #2E4A3B; color: #F4EFE6; border: 1px solid #2E4A3B;">Hiring</button>

<button type="button" data-on-click="2" aria-pressed="false" style="font: inherit; font-size: 14px; min-height: 44px; padding: 10px 16px; border-radius: 999px; cursor: pointer; background: transparent; color: #26231F; border: 1px solid #D4CAB8;">Booking a shoot</button>

<button type="button" data-on-click="3" aria-pressed="false" style="font: inherit; font-size: 14px; min-height: 44px; padding: 10px 16px; border-radius: 999px; cursor: pointer; background: transparent; color: #26231F; border: 1px solid #D4CAB8;">Just saying hi</button>

</div>
<div class="form">
<label>Name<input type="text" name="name" autocomplete="name" required></label>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<label style="grid-column: 1 / -1">Message<textarea name="message" rows="5" required></textarea></label>
</div>
<div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<button type="submit" style="font: inherit; font-weight: 600; font-size: 16px; background: #26231F; color: #F4EFE6; border: 0; min-height: 48px; padding: 14px 26px; border-radius: 999px; cursor: pointer">Send</button>


</div>
</form>
</div>
</section>

<span>© 2026 Frederick Uy · Tacoma, WA</span>
<span style="display: flex; gap: 20px; flex-wrap: wrap"><a href="https://www.linkedin.com/in/frederickuy/">LinkedIn</a><a href="https://www.instagram.com/frederick.uy">Instagram</a><a href="https://frederick-uy.medium.com/">Medium</a><a href="/contact/">Contact</a></span>
</footer>

</div></div>
<script src="/assets/runtime.js"></script>
<script>
var DCLogic = DC.DCLogic;
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'hire', sent: false }; }
  renderVals() {
    const m = this.state.mode;
    const defs = [['hire', 'Hiring'], ['shoot', 'Booking a shoot'], ['hi', 'Just saying hi']];
    const opts = defs.map(([id, label]) => ({
      label, pressed: m === id ? 'true' : 'false',
      pick: () => this.setState({ mode: id, sent: false }),
      style: 'font: inherit; font-size: 14px; min-height: 44px; padding: 10px 16px; border-radius: 999px; cursor: pointer; ' + (m === id ? 'background: #2E4A3B; color: #F4EFE6; border: 1px solid #2E4A3B;' : 'background: transparent; color: #26231F; border: 1px solid #D4CAB8;')
    }));
    return { opts, sent: this.state.sent, submit: (e) => { e.preventDefault(); const f = e.target; const fd = new FormData(f); fd.append('topic', defs.find(d => d[0] === m)[1]); fd.append('_subject', 'frederickuy.com: ' + defs.find(d => d[0] === m)[1]); fetch('https://formspree.io/f/xkjryevg', { method: 'POST', body: fd, headers: { Accept: 'application/json' } }).then(r => { if (r.ok) { f.reset(); this.setState({ sent: true, error: false }); } else this.setState({ error: true }); }).catch(() => this.setState({ error: true })); }, error: this.state.error };
  }
}
DC.mount(Component, document.getElementById('dc-root'), "<div style=\"min-height: 100vh; width: 100%\">\n\n<div style=\"border-bottom: 1px solid #DCD3C3\">\n<header class=\"wrap\" style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 28px\">\n<a href=\"/\" style=\"font-family: Fraunces, Georgia, serif; font-size: 26px; color: #26231F; text-decoration: none\">Frederick Uy<\/a>\n<nav class=\"nav\" aria-label=\"Main\" style=\"display: flex; gap: 28px; flex-wrap: wrap; align-items: center\">\n<a href=\"/\">Home<\/a>\n<a href=\"/about/\">About<\/a>\n<a href=\"/work/\">Work<\/a>\n<a href=\"/photography/\">Photography<\/a>\n<a href=\"/journal/\">Journal<\/a>\n<a href=\"/contact/\" class=\"say\" aria-current=\"page\">Say hello<\/a>\n<\/nav>\n<\/header>\n<\/div>\n\n<section id=\"contact\" class=\"wrap\" style=\"padding-top: 56px; padding-bottom: 108px\">\n<div class=\"contact\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<h1 style=\"font-size: clamp(40px, 4.6vw, 60px); line-height: 1.06\">Hiring, booking, or just saying hi?<\/h1>\n<p style=\"font-size: 17px; line-height: 1.65; color: #4F4942\">Pick what fits and I’ll reply within a day.<\/p>\n<p style=\"font-size: 16px; line-height: 1.9\"><a href=\"mailto:frederickuy19@gmail.com\">frederickuy19@gmail.com<\/a><br><a href=\"https://www.linkedin.com/in/frederickuy/\">LinkedIn<\/a> · <a href=\"https://www.instagram.com/frederick.uy\">Instagram<\/a><\/p>\n<\/div>\n<form onSubmit=\"{{submit}}\" style=\"background: transparent; border: 1px solid #DCD3C3; border-radius: 6px; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n<div role=\"group\" aria-label=\"What is this about\" style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<sc-for list=\"{{opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{o.pick}}\" aria-pressed=\"{{o.pressed}}\" style=\"{{o.style}}\">{{o.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div class=\"form\">\n<label>Name<input type=\"text\" name=\"name\" autocomplete=\"name\" required><\/label>\n<label>Email<input type=\"email\" name=\"email\" autocomplete=\"email\" required><\/label>\n<label style=\"grid-column: 1 / -1\">Message<textarea name=\"message\" rows=\"5\" required><\/textarea><\/label>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 16px; flex-wrap: wrap\">\n<button type=\"submit\" style=\"font: inherit; font-weight: 600; font-size: 16px; background: #26231F; color: #F4EFE6; border: 0; min-height: 48px; padding: 14px 26px; border-radius: 999px; cursor: pointer\">Send<\/button>\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\"><span role=\"status\" style=\"color: #2E4A3B; font-weight: 500\">Sent. Talk soon!<\/span><\/sc-if>\n<sc-if value=\"{{error}}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"color: #A5521E; font-weight: 500\">That didn’t send. Please email me instead.<\/span><\/sc-if>\n<\/div>\n<\/form>\n<\/div>\n<\/section>\n\n<footer class=\"wrap\" style=\"border-top: 1px solid #DCD3C3; padding-top: 32px; padding-bottom: 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: #6A6258\">\n<span>© 2026 Frederick Uy · Tacoma, WA<\/span>\n<span style=\"display: flex; gap: 20px; flex-wrap: wrap\"><a href=\"https://www.linkedin.com/in/frederickuy/\">LinkedIn<\/a><a href=\"https://www.instagram.com/frederick.uy\">Instagram<\/a><a href=\"https://frederick-uy.medium.com/\">Medium<\/a><a href=\"/contact/\">Contact<\/a><\/span>\n<\/footer>\n\n<\/div>");
</script>
</body>
